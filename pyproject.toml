[build-system]
requires = ["setuptools>=64", "pybind11>=2.11"]
build-backend = "setuptools.build_meta"

[project]
name = "tri_tier"
version = "0.1.0"
description = "Tri Tier Cache system to reduce memory usage in longer contexts"
readme = "README.md"
authors = [
    { name = "RahulGPi", email = "rahulgpai99@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.14.0",
    "datasets>=5.0.1",
    "ninja>=1.13.0",
    "numpy>=2.5.2",
    "psutil>=7.2.2",
    "pybind11>=3.1.0",
    "sentencepiece>=0.2.2",
    "setuptools>=84.0.0",
    "torch>=2.13.0",
    "transformers>=5.16.1",
]

[project.scripts]
idk-what-to-name-this = "tri_tier.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]
