name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system compiler & OpenMP runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ libgomp1

      - name: Install Python build tools and dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel pybind11
          pip install -e .
          pip install pytest

      - name: Run test suite
        run: |
          pytest tests -v
