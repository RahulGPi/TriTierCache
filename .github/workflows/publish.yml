name: Publish to PyPI

on:
  release:
    types: [published]
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build source distribution and wheels
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools and OpenMP
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ libgomp1
          python -m pip install --upgrade pip build twine pybind11 setuptools wheel

      - name: Build sdist and repair manylinux wheel
        run: |
          python -m pip install auditwheel patchelf
          python -m build
          # Convert raw linux_x86_64 wheel to PyPI-compliant manylinux wheel
          auditwheel repair dist/*linux_x86_64.whl -w dist/
          rm -f dist/*linux_x86_64.whl
          twine check dist/*

      - name: Store distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish-pypi:
    name: Publish package to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tri-tier
    permissions:
      id-token: write  # Mandatory for PyPI Trusted Publishing (OIDC)
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
