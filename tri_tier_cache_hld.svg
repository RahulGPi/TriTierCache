<svg viewBox="0 0 1320 700" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','SF Pro Display',system-ui,-apple-system,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 8 3, 0 6" fill="#9BA3AF"/>
    </marker>
    <marker id="ah-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 8 3, 0 6" fill="#0D9488"/>
    </marker>
    <marker id="ah-ref" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 8 3, 0 6" fill="none" stroke="#9BA3AF" stroke-width="1"/>
    </marker>
  </defs>

  <!-- Layer 1: canvas -->
  <rect width="100%" height="100%" fill="#F7F8FA"/>

  <!-- Layer 2: zone fill -->
  <rect x="520" y="80" width="640" height="560" rx="12" fill="#0D9488" fill-opacity="0.04"/>

  <!-- Layer 3: connectors -->
  <line x1="220" y1="318" x2="310" y2="318" stroke="#9BA3AF" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="310" y1="336" x2="220" y2="336" stroke="#9BA3AF" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#ah)"/>

  <path d="M490,326 H520 V148 H556" fill="none" stroke="#9BA3AF" stroke-width="1.5" marker-end="url(#ah)"/>

  <circle cx="651" cy="220" r="3" fill="#9BA3AF"/>
  <line x1="651" y1="176" x2="651" y2="217" stroke="#9BA3AF" stroke-width="1.5"/>
  <line x1="651" y1="223" x2="651" y2="250" stroke="#9BA3AF" stroke-width="1.5" marker-end="url(#ah)"/>
  <path d="M651,220 H770 V408 H746" fill="none" stroke="#9BA3AF" stroke-width="1.5" marker-end="url(#ah)"/>

  <line x1="651" y1="306" x2="651" y2="380" stroke="#9BA3AF" stroke-width="1.5" marker-end="url(#ah)"/>

  <path d="M350,356 V600 H641 V576" fill="none" stroke="#9BA3AF" stroke-width="1.5" marker-end="url(#ah)"/>

  <path d="M711,540 H800 V278 H746" fill="none" stroke="#9BA3AF" stroke-width="1" marker-end="url(#ah-ref)"/>

  <path d="M746,148 H815 V266 H880" fill="none" stroke="#9BA3AF" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="746" y1="278" x2="880" y2="278" stroke="#9BA3AF" stroke-width="1.5" marker-end="url(#ah)"/>
  <path d="M746,408 H815 V290 H880" fill="none" stroke="#9BA3AF" stroke-width="1.5" marker-end="url(#ah)"/>

  <path d="M975,306 V650 H430 V356" fill="none" stroke="#0D9488" stroke-width="2" marker-end="url(#ah-accent)"/>

  <!-- Layer 4+5: nodes -->
  <rect x="40" y="300" width="180" height="52" rx="8" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="130" y="322" text-anchor="middle" font-size="13" font-weight="500" fill="#374151">Llama attention layer</text>
  <text x="130" y="338" text-anchor="middle" font-size="11" fill="#9CA3AF">HF forward() &#8212; untouched</text>

  <rect x="310" y="296" width="180" height="60" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.5"/>
  <text x="400" y="320" text-anchor="middle" font-size="13" font-weight="600" fill="#085041">Attention interceptor</text>
  <text x="400" y="338" text-anchor="middle" font-size="11" fill="#0F6E56">patch_llama.py hook</text>

  <rect x="556" y="120" width="190" height="56" rx="8" fill="#FFFFFF" stroke="#E4E7EC" stroke-width="1"/>
  <text x="651" y="144" text-anchor="middle" font-size="13" font-weight="500" fill="#101828">Tier 1 &#8212; recent window</text>
  <text x="651" y="162" text-anchor="middle" font-size="11" fill="#667085">ring buffer &#183; FP32 &#183; exact</text>

  <rect x="556" y="250" width="190" height="56" rx="8" fill="#FFFFFF" stroke="#E4E7EC" stroke-width="1"/>
  <text x="651" y="274" text-anchor="middle" font-size="13" font-weight="500" fill="#101828">Tier 2 &#8212; heavy hitters</text>
  <text x="651" y="292" text-anchor="middle" font-size="11" fill="#667085">top 5% attention &#183; FP32</text>

  <rect x="556" y="380" width="190" height="56" rx="8" fill="#FFFFFF" stroke="#E4E7EC" stroke-width="1"/>
  <text x="651" y="404" text-anchor="middle" font-size="13" font-weight="500" fill="#101828">Tier 3 &#8212; background</text>
  <text x="651" y="422" text-anchor="middle" font-size="11" fill="#667085">2-bit KIVI &#183; compressed</text>

  <ellipse cx="641" cy="515" rx="85" ry="10" fill="#F9FAFB" stroke="#D5D9EB" stroke-width="1"/>
  <rect x="556" y="515" width="170" height="50" fill="#F9FAFB" stroke="none"/>
  <line x1="556" y1="515" x2="556" y2="565" stroke="#D5D9EB" stroke-width="1"/>
  <line x1="726" y1="515" x2="726" y2="565" stroke="#D5D9EB" stroke-width="1"/>
  <ellipse cx="641" cy="565" rx="85" ry="10" fill="#F9FAFB" stroke="#D5D9EB" stroke-width="1"/>
  <text x="641" y="542" text-anchor="middle" font-size="12" font-weight="500" fill="#101828">Global attn score</text>
  <text x="641" y="558" text-anchor="middle" font-size="10" fill="#667085">drives eviction ranking</text>

  <rect x="880" y="250" width="190" height="56" rx="8" fill="#FFFFFF" stroke="#E4E7EC" stroke-width="1"/>
  <text x="975" y="274" text-anchor="middle" font-size="13" font-weight="500" fill="#101828">Cache reconstruction</text>
  <text x="975" y="292" text-anchor="middle" font-size="11" fill="#667085">dequant + concat, ordered</text>

  <!-- Layer 6: edge labels (drawn last, on top) -->
  <rect x="222" y="304" width="66" height="16" rx="3" fill="#F7F8FA"/>
  <text x="255" y="315" text-anchor="middle" font-size="10" fill="#667085">Q, K, V</text>

  <rect x="235" y="340" width="60" height="16" rx="3" fill="#F7F8FA"/>
  <text x="265" y="351" text-anchor="middle" font-size="10" fill="#667085">context</text>

  <rect x="472" y="202" width="96" height="16" rx="3" fill="#F7F8FA"/>
  <text x="520" y="213" text-anchor="middle" font-size="10" fill="#667085">ingest_token()</text>

  <rect x="601" y="192" width="98" height="16" rx="3" fill="#F7F8FA"/>
  <text x="650" y="203" text-anchor="middle" font-size="10" fill="#667085">score &#8805; threshold</text>

  <rect x="770" y="332" width="112" height="16" rx="3" fill="#F7F8FA"/>
  <text x="826" y="343" text-anchor="middle" font-size="10" fill="#667085">score &lt; threshold</text>

  <rect x="601" y="335" width="98" height="16" rx="3" fill="#F7F8FA"/>
  <text x="650" y="346" text-anchor="middle" font-size="10" fill="#667085">HH full, demoted</text>

  <rect x="360" y="465" width="150" height="16" rx="3" fill="#F7F8FA"/>
  <text x="435" y="476" text-anchor="middle" font-size="10" fill="#667085">accumulate_attn_scrs()</text>

  <rect x="757" y="524" width="120" height="16" rx="3" fill="#F7F8FA"/>
  <text x="817" y="535" text-anchor="middle" font-size="10" fill="#667085">reads score/threshold</text>

  <rect x="762" y="220" width="88" height="16" rx="3" fill="#F7F8FA"/>
  <text x="806" y="231" text-anchor="middle" font-size="10" fill="#667085">on reconstruct()</text>

  <rect x="687" y="642" width="128" height="16" rx="3" fill="#F0FDFA"/>
  <text x="751" y="653" text-anchor="middle" font-size="10" fill="#0F6E56" font-weight="500">K_full, V_full (ordered)</text>

  <!-- Layer 7: zone label -->
  <text x="536" y="100" font-size="10" font-weight="600" fill="#0D9488" letter-spacing="0.6" opacity="0.8">TRI-TIER CACHE MANAGER</text>

  <!-- Layer 8: title + legend -->
  <text x="32" y="32" font-size="15" font-weight="600" fill="#101828" letter-spacing="-0.2">Tri-tier KV cache &#8212; high-level architecture</text>
  <text x="32" y="50" font-size="11" fill="#667085">One token's path through ingestion, eviction routing, and reconstruction</text>

  <g transform="translate(980,596)">
    <line x1="0" y1="8" x2="24" y2="8" stroke="#9BA3AF" stroke-width="1.5" marker-end="url(#ah)"/>
    <text x="30" y="12" font-size="10" fill="#667085">Sync data</text>
    <line x1="130" y1="8" x2="154" y2="8" stroke="#9BA3AF" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#ah)"/>
    <text x="160" y="12" font-size="10" fill="#667085">Return value</text>
    <line x1="0" y1="26" x2="24" y2="26" stroke="#9BA3AF" stroke-width="1" marker-end="url(#ah-ref)"/>
    <text x="30" y="30" font-size="10" fill="#667085">Reads (dependency)</text>
    <line x1="130" y1="26" x2="154" y2="26" stroke="#0D9488" stroke-width="2" marker-end="url(#ah-accent)"/>
    <text x="160" y="30" font-size="10" fill="#0D9488" font-weight="500">Primary / fixed path</text>
  </g>
</svg>
